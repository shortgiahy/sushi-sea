name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ROKIT_VERSION: "1.2.0"

jobs:
  lint-format-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -sL -o rokit.zip "https://github.com/rojo-rbx/rokit/releases/download/v${ROKIT_VERSION}/rokit-${ROKIT_VERSION}-linux-x86_64.zip"
          unzip -o rokit.zip -d "$HOME/.rokit-bin"
          chmod +x "$HOME/.rokit-bin/rokit"
          echo "$HOME/.rokit-bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain (rokit.toml)
        run: |
          "$HOME/.rokit-bin/rokit" self-install
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit-bin/rokit" install --no-trust-check

      - name: Refresh Roblox standard library for selene
        run: selene update-roblox-std

      - name: rojo build
        run: rojo build -o sushi-sea.rbxlx

      - name: selene lint
        run: selene src

      - name: stylua --check
        run: stylua --check src

      - name: Headless tests (lune)
        run: |
          for f in tests/*.spec.luau; do
            echo "Running $f"
            lune run "$f"
          done
